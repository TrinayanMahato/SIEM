# Routed by main.py → process_alert() → handle_multiple_failed_login_attempts()
name: Multiple Failed Login Attempts
type: frequency
index: soc-logs-*

num_events: 3
timeframe:
  minutes: 5
realert:
  minutes: 5

filter:
  - query:
      query_string:
        query: '(processImagePath.keyword:*sudo OR processImagePath.keyword:*login) AND eventMessage:("incorrect password" OR "authentication failure" OR "authentication error")'

alert:
  - post
http_post_url: "http://127.0.0.1:8000/webhook"
http_post_all_values: true
http_post_static_payload:
  rule_name: "Multiple Failed Login Attempts"
