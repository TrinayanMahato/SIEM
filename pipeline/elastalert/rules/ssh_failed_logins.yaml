# Routed by main.py → process_alert() → handle_ssh_failed_logins()
# "name" MUST stay exactly as-is: the dispatcher matches on it.
name: SSH Failed Logins
type: frequency
index: soc-logs-*

num_events: 5
timeframe:
  minutes: 5
realert:
  minutes: 5

filter:
  - query:
      query_string:
        query: 'processImagePath.keyword:*sshd AND eventMessage:("Failed password" OR "Invalid user" OR "authentication error")'

alert:
  - post
http_post_url: "http://127.0.0.1:8000/webhook"
http_post_all_values: true
http_post_static_payload:
  rule_name: "SSH Failed Logins"
