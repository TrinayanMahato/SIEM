# Logstash — consumes the Kafka topic, parses, indexes into Elasticsearch.

input {
  kafka {
    bootstrap_servers => "127.0.0.1:9092"
    topics => ["soc-raw-logs"]
    codec => "json"
  }
}

filter {
  # Web-server lines arrive as JSON inside the message field; lift them
  # into a "web" object so rules can match on web.status
  json {
    source => "message"
    target => "web"
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "soc-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
